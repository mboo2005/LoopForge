# Source build of this checkout, layered on compose.yaml:
#   ./start.sh dev     or   docker compose -f compose.yaml -f compose.dev.yaml --profile platform up --build
# The fixed local tag keeps source builds from overwriting the pinned GHCR image.
services:
  platform:
    image: loopforge-platform:local
    build:
      context: .
      args:
        LOOPFORGE_BUILD_JOBS: ${LOOPFORGE_BUILD_JOBS:-}
        LOOPFORGE_COMMIT: ${LOOPFORGE_COMMIT:-}
        CODEBUDDY_PACKAGE: ${CODEBUDDY_PACKAGE-@tencent-ai/codebuddy-code@2.167.0}
        # Build-time module/package mirrors. Set GOPROXY in .env when
        # proxy.golang.org is unreachable (for example https://goproxy.cn,direct).
        GOPROXY: ${GOPROXY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        # GitHub release host for the relocatable Python; override where
        # github.com is unreachable. SKIP_PYTHON_STANDALONE=1 omits it entirely
        # (sandbox images without python3 then need their own).
        PYTHON_STANDALONE_BASE: ${PYTHON_STANDALONE_BASE:-}
        SKIP_PYTHON_STANDALONE: ${SKIP_PYTHON_STANDALONE:-0}
    environment:
      AGENTFLOW_ISOLATED_IMAGE: loopforge-platform:local
